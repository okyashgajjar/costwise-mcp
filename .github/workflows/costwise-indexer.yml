name: CostWise Remote Indexer

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run nightly

jobs:
  precompute-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Must satisfy go.mod (go 1.25.5) — '1.22' would force a toolchain download
          # and can break GOTOOLCHAIN=off environments.
          go-version: '1.25'

      - name: Build costwise CLI
        run: |
          CGO_ENABLED=1 go build -o ./costwise ./cmd/costwise/

      - name: Generate Cache
        run: |
          ./costwise index --headless

      - name: Upload Index Artifact
        uses: actions/upload-artifact@v4
        with:
          name: costwise-cache
          path: .mycli-fts/
          retention-days: 5
